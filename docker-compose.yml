services:
  issuescout:
    build: .
    container_name: issuescout
    ports:
      - "4173:4173"
    environment:
      - PORT=4173
      - HOST=0.0.0.0
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b-instruct
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: issuescout-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
